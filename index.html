<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lukas Zamora</title>
<meta name="description" content="Lukas Zamora. Selected work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400..800&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:      #F9F9F9;
    --ink:     #262420;
    --muted:   #8C867A;
    --line:    #262420;
    --panel-bg:#F9F9F9;
    --font-display: 'EB Garamond', serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --pad: clamp(10px, 3.8vw, 40px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ transition-duration:0.001ms !important; }
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-mono);
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ============ HOME ============ */
  main.home{
    padding:clamp(24px,3vh,56px) var(--pad) 200px;
    min-height:100vh;
  }

  .line{
    display:block;
    font-family:var(--font-display);
    font-style:italic;
    font-weight:400;
    font-size:clamp(4.4rem, 6.6vw, 4.15rem);
    line-height:0.95;
    letter-spacing:-0.005em;
    cursor:pointer;
    width:fit-content;
    max-width:100%;
    position:relative;
  }
  .line.name{
    margin-bottom:0.15em;
  }
  .line::after{
    content:"";
    position:absolute;
    left:0; bottom:0.08em;
    width:0%;
    height:1px;
    background:var(--ink);
    transition:width 0.3s ease;
  }
  .line:hover::after,
  .line:focus-visible::after{ width:100%; }
  .line:focus-visible{ outline:none; }

  /* ============ FIXED FOOTER ============ */
  .footer-fixed{
    position:fixed;
    left:var(--pad);
    bottom:22px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
    max-width:calc(100% - (var(--pad) * 2));
  }
  .pill-group{
    display:flex;
    gap:8px;
  }
  .pill{
    border:1px solid var(--ink);
    padding:6px 14px;
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.02em;
    background:var(--bg);
  }
  .pill:hover{ background:var(--ink); color:var(--bg); }

  .footer-meta{
    font-family:var(--font-mono);
    font-size:0.68rem;
    line-height:1.5;
    color:var(--muted);
  }

  /* ============ SLIDE PANEL ============ */
  .panel{
    position:fixed;
    top:0; right:0;
    width:50%;
    height:100vh;
    background:var(--panel-bg);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform 0.5s cubic-bezier(.22,.7,.2,1);
    z-index:100;
    overflow-y:auto;
  }
  .panel.open{ transform:translateX(0); }
  @media (max-width:800px){
    .panel{ width:100%; border-left:none; }
  }

  .panel-bar{
    position:sticky;
    top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px var(--pad);
    background:var(--panel-bg);
    border-bottom:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.02em;
    z-index:2;
  }
  .panel-bar .close-btn{ font-family:var(--font-mono); font-size:0.75rem; }
  .panel-bar .close-btn:hover{ color:var(--muted); }

  .panel-body{ padding: 8px var(--pad) 80px; }

  /* --- shared row/divider pattern --- */
  .prow{
    display:grid;
    grid-template-columns: 1fr 1.6fr;
    gap:32px;
    padding:26px 0;
    border-bottom:1px solid var(--line);
    font-size:0.76rem;
    line-height:1.7;
  }
  .prow:last-child{ border-bottom:none; }
  @media (max-width:560px){
    .prow{ grid-template-columns:1fr; gap:10px; }
  }
  .prow .label{ color:var(--ink); white-space:nowrap; }
  .prow .content{ color:var(--ink); }
  .prow .entry{ margin-bottom:18px; }
  .prow .entry:last-child{ margin-bottom:0; }
  .prow .muted{ color:var(--muted); }
  .prow em{ font-style:italic; }

  /* --- project panel specific --- */
  .proj-title{
    text-align:center;
    padding:36px var(--pad) 8px;
    font-family:var(--font-display);
  }
  .proj-title h2{
    font-size:clamp(1.5rem,3vw,2.1rem);
    font-weight:400;
    font-style:normal;
    letter-spacing:-0.01em;
  }
  .proj-title .tagline{
    font-style:italic;
    font-size:1.05rem;
    margin-top:4px;
    color:var(--ink);
  }
  .proj-title .role{
    font-family:var(--font-mono);
    font-style:normal;
    font-size:0.72rem;
    color:var(--muted);
    margin-top:10px;
    letter-spacing:0.02em;
  }

  .img-placeholder{
    margin:28px var(--pad) 4px;
    aspect-ratio:16/10;
    position:relative;
    /* background-color:#EEE7D9;
    background-image:
      repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100%/6)),
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(100%/5)); */
  }
  .img-placeholder .cap{
    position:absolute;
    bottom:10px; left:10px;
    font-family:var(--font-mono);
    font-size:0.58rem;
    line-height:1.4;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
 
  .img-block{
    margin:28px var(--pad) 4px;
  }
  .img-block img{
    display:block;
    width:100%;
    height:auto;
  }

  @media (max-width:560px){
    .proj-title{ padding-inline:20px; }
    .img-placeholder{ margin-inline:20px; }
  }
</style>
</head>
<body>

<div class="top-accent"></div>

<!-- ============ HOME ============ -->
<main class="home">
  <span class="line name" tabindex="0" role="button" data-type="about">Lukas Zamora</span>
  <span class="line" tabindex="0" role="button" data-type="project" data-id="goldrush">Gold Rush Vinyl</span>
  <span class="line" tabindex="0" role="button" data-type="project" data-id="mockup">Vinyl Mockup Tool</span>
  <span class="line" tabindex="0" role="button" data-type="project" data-id="artportfolio">Sarah LaRose — Artist Portfolio</span>
  <span class="line" tabindex="0" role="button" data-type="project" data-id="treethatmoves">Tree That Moves</span>
  <span class="line" tabindex="0" role="button" data-type="project" data-id="tapes">Tapes from the Middle East</span>
</main>

<div class="footer-fixed">
  <div class="pill-group">
    <button class="pill" data-type="about">About</button>
    <a class="pill" href="https://www.linkedin.com/in/lukas-zamora/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</div>

<!-- ============ SLIDE PANEL ============ -->
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-bar">
    <span id="panel-eyebrow">About</span>
    <button class="close-btn" id="panel-close" aria-label="Close panel">[-X-]</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script>
  const projects = {
    goldrush: {
      title:"Gold Rush Vinyl",
      tagline:"Maintaining Austin's premier record pressing plant's site.",
      image:"images/goldrush-home.png", 
      role:"Webflow · CMS · SEO · GTM",
      client:"",
      year:"2025-2026",
      body:[
        "The website behind Austin's only record pressing plant, and one I run end to end — design, development, SEO, and Google Tag Manager, plus every new feature that gets added along the way. There's no separation between the marketing site and the product here; changes to search rankings, page speed, and new tools all come out of the same ongoing work.",
        "Recent additions include restructured product pages for better search visibility and the vinyl mockup tool below, built to give customers a way to preview their release before it goes to press."
      ]
    },
    mockup: {
      title:"Vinyl Mockup Tool",
      tagline:"Preview vinyl colors and jacket art in real time before placing an order.",
      image:"images/mockup-tool.png", 
      role:"Vanilla HTML · CSS · JS · Canvas API",
      client:"",
      year:"2026",
      body:[
        "Built for Gold Rush Vinyl customers preparing a new release, this tool lets someone upload their jacket and label artwork, choose a vinyl color, and see a realistic mockup of the finished record before it's pressed.",
        "It replaced a back-and-forth of emailed proofs with something a customer can do themselves in a few minutes, same jacket art, same label art, instant preview."
      ]
    },
    artportfolio: {
      title:"Sarah LaRose — Artist Portfolio",
      tagline:"Portfolio site for an Austin-based oil painter",
      role:"Webflow · CMS Collections",
      image:"images/sarah-gallery.png",
      client:"",
      year:"2026",
      body:[
        "Sarah paints from her home studio in Austin, and needed a site that got out of the way of the work. The layout is built around large, unobstructed views of each painting, with just enough structure, series, medium, dimensions, to help her audience navigate.",
        "No storefront, no distractions. The goal was a site that reads like a small gallery, not a product catalog."
      ]
    },
    treethatmoves: {
      title:"Tree That Moves",
      tagline:"Static site for an independent music label",
      role:"Vanilla HTML · CSS · JS",
      image:"images/treethatmoves.png",
      client:"",
      year:"2025-2026",
      body:[
        "Tree That Moves needed a simple, fast presence online. A place to point people toward releases without the overhead of a full CMS. The site is entirely static: no database, no admin panel, just a clean landing page that loads instantly."
      ]
    },
    tapes: {
      title:"Tapes from the Middle East",
      tagline:"Static site for an independent music label",
      role:"Vanilla HTML · CSS · JS",
      image:"images/casettes.png",
      client:"",
      year:"2025-2026",
      body:[
        "A hobby project of cassette mixtapes I put together and package with original J-card artwork, designed in Photoshop and Illustrator. Each tape gets its own look, from typography to color story, built around whatever the mix is doing musically.",
        "The series is a work in progress, with new tapes and new J-cards added as they're finished."
      ]
    }
  };

  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  const panelEyebrow = document.getElementById('panel-eyebrow');

  function aboutHTML(){
    return `
      <div class="prow">
        <div class="label">
          © 2026<br>
          Lukas Zamora<br>
          Austin, TX
          <a href="mailto:lukaspzamora@gmail.com">lukaspzamora@gmail.com</a>
        </div>
        <div class="content">
          I'm Lukas, based in Austin. At Gold Rush Vinyl I wear a lot of hats. Pressing records, sure, but also building and maintaining the website end to end: design, development, SEO, and every feature in between. Web design started as something I taught myself on the side, and it's turned into the work I want to be doing full-time.
          <br><br>
          Outside of that, most of my time goes to things that end up feeding back into the work: playing guitar, painting, making mixtapes with their own hand-designed J-cards, riding my bike, and collecting records. Gold Rush Vinyl sits right at the middle of a lot of that.
        </div>
      </div>

      <div class="prow">
        <div class="label">Employment</div>
        <div class="content">
          <div class="entry">
            Lead Press Operator, Web Designer<br>
            <em>Gold Rush Vinyl</em><br>
            <span class="muted">Austin, TX</span><br>
            June 2022 – Present
          </div>
          <div class="entry">
            Product Data Specialist<br>
            <em>Four Hands</em><br>
            <span class="muted">Austin, TX</span><br>
            Nov 2021 - May 2022
          </div>
          <div class="entry">
            Data Processing Technician<br>
            <em>Loram Technologies</em><br>
            <span class="muted">Georgetown, TX</span><br>
            May 2021 – Nov 2021
          </div>
        </div>
      </div>

      <div class="prow">
        <div class="label">Education</div>
        <div class="content">
          <div class="entry">
            BS, Applied Mathematics<br>
            <span class="muted">Texas A&M University</span><br>
            2020
          </div>
        </div>
      </div>
    `;
  }

  function projectHTML(p){
    return `
      <div class="proj-title">
        <h2>${p.title}</h2>
        <div class="role">${p.role}</div>
      </div>
      <div class="img-block">
        <img src="${p.image}" alt="${p.title} project visual">
      </div>
      <div class="prow">
        <div class="label">
          ${p.title}
        </div>
        <div class="content">
          ${p.body.map(par => `<p style="margin-bottom:14px;">${par}</p>`).join('')}
        </div>
      </div>
    `;
  }

  function openPanel(type, id){
    if (type === 'about'){
      panelEyebrow.textContent = 'About';
      panelBody.innerHTML = aboutHTML();
    } else {
      const p = projects[id];
      panelEyebrow.textContent = `${p.title}, ${p.year}`;
      panelBody.innerHTML = projectHTML(p);
    }
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
    panelBody.parentElement.scrollTop = 0;
  }

  function closePanel(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
  }
 
  document.querySelectorAll('[data-type]').forEach(el => {
    el.addEventListener('click', () => openPanel(el.dataset.type, el.dataset.id));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openPanel(el.dataset.type, el.dataset.id);
      }
    });
  });
 
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
  });
 
  document.addEventListener('click', (e) => {
    if (!panel.classList.contains('open')) return;
    const clickedTrigger = e.target.closest('[data-type]');
    const clickedInsidePanel = panel.contains(e.target);
    if (!clickedInsidePanel && !clickedTrigger){
      closePanel();
    }
  });
</script>

</body>
</html>
